<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0E0F11;
    background-image:
      linear-gradient(rgba(236,238,240,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(236,238,240,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 96px;
    font-family: Georgia, 'Times New Roman', serif;
    position: relative;
  }
  /* outer amber corner brackets */
  .corner { position: absolute; width: 48px; height: 48px; }
  .corner.tl { top: 44px; left: 44px; border-top: 3px solid #FFC24B; border-left: 3px solid #FFC24B; }
  .corner.br { bottom: 44px; right: 44px; border-bottom: 3px solid #FFC24B; border-right: 3px solid #FFC24B; }

  .mark { width: 300px; height: 300px; flex: none; }

  .word { display: flex; flex-direction: column; }
  .name {
    font-weight: 700;
    font-size: 140px;
    line-height: 0.9;
    letter-spacing: 0.02em;
    color: #ECEEF0;
  }
  .tick { width: 84px; height: 5px; background: #FFC24B; margin: 28px 0 26px; }
  .studio {
    font-family: 'Courier New', monospace;
    font-size: 30px;
    letter-spacing: 0.55em;
    color: #9BA1A8;
    text-transform: uppercase;
  }
  .tagline {
    font-family: 'Courier New', monospace;
    font-size: 20px;
    line-height: 1.5;
    letter-spacing: 0.04em;
    color: #5A6066;
    margin-top: 30px;
    max-width: 560px;
  }
</style>
</head>
